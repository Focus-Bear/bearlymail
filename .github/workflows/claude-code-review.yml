name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # Dependabot-triggered runs get Dependabot's own secret store, not the
    # repo's, so CLAUDE_CODE_OAUTH_TOKEN resolves empty and the action dies on
    # "Environment variable validation failed" before reviewing anything. A
    # dependency bump is covered by the rest of CI (build, tests, audit), so
    # skip the AI review rather than leaving a permanently red check that
    # blocks the routine bump backlog.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write (not read) so the reviewer can actually POST its inline + summary
      # review comments — with read-only it ran green but silently posted nothing.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependabot (and any other bot) opens PRs as a non-human actor, which
          # the action refuses by default: every Dependabot PR failed this job
          # with "Workflow initiated by non-human actor". Matches claude.yml.
          allowed_bots: '*'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

