name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Optional: installation token from YOUR GitHub App (not GITHUB_TOKEN) so PRs
      # can trigger pull_request workflows. Set CLAUDE_GITHUB_APP_CLIENT_ID (variable)
      # and CLAUDE_GITHUB_APP_PRIVATE_KEY (secret). See docs/claude-github-app-auth.md
      - name: Create GitHub App installation token (optional)
        id: claude_github_app_token
        if: ${{ vars.CLAUDE_GITHUB_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLAUDE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full clone needed so Claude can fetch main and resolve merge conflicts
          fetch-depth: 0
          # Also fetch tags so Claude has full context
          fetch-tags: true
          token: ${{ steps.claude_github_app_token.outputs.token || github.token }}

      # Runner always injects GITHUB_TOKEN for the job; gh/git often prefer that over
      # the action's github_token input alone. Override both here so pushes from this
      # step use the installation token when configured — otherwise GitHub suppresses
      # follow-up push/pull_request workflow runs for those commits.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.claude_github_app_token.outputs.token || github.token }}
          GH_TOKEN: ${{ steps.claude_github_app_token.outputs.token || github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.claude_github_app_token.outputs.token || github.token }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          allowed_bots: '*'

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: |
            --append-system-prompt "NEVER commit to main. Create branches named claude/issue-${{ github.event.issue.number }}. Write unit tests. When you're done with the branch, open a draft PR referencing the issue - this is pre-approved. Make it "References #2344" not "Closes #4545" because I don't want the issue to auto-close when I merge the PR. You don't have to wait for approval to create a PR. IMPORTANT: before pushing, always run 'git fetch origin main' and rebase on latest main if there have been other commits to avoid merge conflicts."
            --allowedTools "Edit,MultiEdit,Write,Read,Bash(git fetch*),Bash(git merge*),Bash(git rebase*),Bash(git cherry-pick*),Bash(git reset*),Bash(git checkout*),Bash(git stash*),Bash(git branch*),Bash(gh*),Bash(npm*)"