name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip running migrations'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: bearlymail/server

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps

      - name: Build server
        working-directory: server
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      # ============================================
      # Initialize PgBoss schema (required before migrations)
      # ============================================
      - name: Initialize PgBoss schema
        working-directory: server
        run: node -e "const PgBoss = require('pg-boss'); const boss = new PgBoss('postgres://test:test@localhost:5432/test'); boss.start().then(() => boss.stop()).then(() => { console.log('PgBoss schema initialized'); process.exit(0); }).catch(err => { console.error('Failed to initialize PgBoss:', err); process.exit(1); })"

      # ============================================
      # Run database migrations against test DB
      # ============================================
      - name: Run database migrations
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_NAME: test
        run: npx typeorm migration:run -d dist/data-source.js

      # ============================================
      # Server smoke tests
      # ============================================
      - name: Start server and run smoke tests
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_NAME: test
          JWT_SECRET: smoke-test-jwt-secret
          ENCRYPTION_KEY: smoke-test-encryption-key-32ch!
          PORT: 3001
          NODE_ENV: test
        run: |
          node dist/main.js &
          SERVER_PID=$!

          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh
          SMOKE_EXIT=$?

          kill $SERVER_PID 2>/dev/null || true
          exit $SMOKE_EXIT

      # ============================================
      # Worker startup check
      # ============================================
      - name: Verify worker starts successfully
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_NAME: test
          JWT_SECRET: smoke-test-jwt-secret
          ENCRYPTION_KEY: smoke-test-encryption-key-32ch!
          NODE_ENV: test
          WORKER_PROCESSES: 1
        run: |
          echo "Starting worker process..."
          node dist/worker.js &
          WORKER_PID=$!

          TIMEOUT=30
          STARTED=false
          for i in $(seq 1 $TIMEOUT); do
            if ! kill -0 $WORKER_PID 2>/dev/null; then
              echo "FATAL: Worker process exited prematurely"
              wait $WORKER_PID
              EXIT_CODE=$?
              echo "Worker exit code: $EXIT_CODE"
              exit 1
            fi

            if [ $i -ge 15 ]; then
              STARTED=true
              break
            fi
            sleep 1
          done

          if [ "$STARTED" = true ]; then
            echo "Worker process is running successfully after 15 seconds"
          else
            echo "FATAL: Worker did not stabilize within ${TIMEOUT} seconds"
            kill $WORKER_PID 2>/dev/null || true
            exit 1
          fi

          kill $WORKER_PID 2>/dev/null || true

          # Avoid hanging indefinitely if the worker ignores SIGTERM.
          for _ in $(seq 1 10); do
            if ! kill -0 $WORKER_PID 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 $WORKER_PID 2>/dev/null; then
            echo "Worker did not stop after SIGTERM, sending SIGKILL"
            kill -9 $WORKER_PID 2>/dev/null || true
          fi

          wait $WORKER_PID 2>/dev/null || true
          echo "Worker startup check passed!"

      # ============================================
      # Notify Cliq on failure
      # ============================================
      - name: Notify Cliq on smoke test failure
        if: failure()
        env:
          ZOHO_CLIQ_BACKEND_BOT_WEBHOOK: ${{ secrets.ZOHO_CLIQ_BACKEND_BOT_WEBHOOK }}
          ZOHO_CLIQ_API_KEY: ${{ secrets.ZOHO_CLIQ_API_KEY }}
          ZOHO_CLIQ_CHANNEL: ${{ secrets.ZOHO_CLIQ_BEARLY_MAIL_SIGNUP_CHANNEL }}
        run: |
          if [ -z "$ZOHO_CLIQ_BACKEND_BOT_WEBHOOK" ] || [ -z "$ZOHO_CLIQ_API_KEY" ]; then
            echo "Cliq credentials not configured, skipping notification"
            exit 0
          fi

          CLIQ_URL="${ZOHO_CLIQ_BACKEND_BOT_WEBHOOK}?zapikey=${ZOHO_CLIQ_API_KEY}"

          PAYLOAD=$(cat <<EOF
          {
            "channel": "${ZOHO_CLIQ_CHANNEL}",
            "message": "*:warning: BearlyMail Smoke Tests Failed*\n\nDeployment has been blocked.\n\n*Branch:* ${GITHUB_REF_NAME}\n*Commit:* ${GITHUB_SHA:0:7}\n*Run:* ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nPlease check the workflow logs for details."
          }
          EOF
          )

          curl -s -X POST "$CLIQ_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: Failed to send Cliq notification"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: smoke-test
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::789877399450:role/BearlyMail-GitHubActions-DeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          COMMIT_HASH: ${{ github.sha }}
          REACT_APP_API_URL: https://api.app.bearlymail.com
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: COMMIT_HASH=$(echo $COMMIT_HASH | cut -c1-7) npm run build

      # ============================================
      # Build and push Docker image to ECR
      # ============================================
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-tag-mutability MUTABLE \
            --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: server
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build --platform linux/amd64 \
          --build-arg COMMIT_HASH=${{ github.sha }} \
          --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          -t ${IMAGE_URI}:latest .
          docker push ${IMAGE_URI}:latest

      # ============================================
      # CDK Deploy (infrastructure changes only)
      # ============================================
      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Deploy Application Stack
        working-directory: infrastructure
        run: |
          cdk deploy BearlyMailStack \
            --require-approval never \
            --outputs-file cdk-outputs.json

      # ============================================
      # Force ECS services to pull the new image
      # ============================================
      - name: Force ECS Service Update
        id: ecs-update
        run: |
          ECS_CLUSTER=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-ECS-Cluster'].Value" \
            --output text)

          WEB_SERVICE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Web-Service-Name'].Value" \
            --output text)

          WORKER_SERVICE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Worker-Service-Name'].Value" \
            --output text)

          echo "ecs_cluster=$ECS_CLUSTER" >> $GITHUB_OUTPUT
          echo "web_service=$WEB_SERVICE" >> $GITHUB_OUTPUT
          echo "worker_service=$WORKER_SERVICE" >> $GITHUB_OUTPUT

          echo "Forcing new deployment on web service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $WEB_SERVICE \
            --force-new-deployment

          echo "Forcing new deployment on worker service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $WORKER_SERVICE \
            --force-new-deployment

      - name: Wait for ECS services to stabilize
        run: |
          echo "Waiting for services to stabilize (this may take a few minutes)..."
          aws ecs wait services-stable \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --services ${{ steps.ecs-update.outputs.web_service }} ${{ steps.ecs-update.outputs.worker_service }}
          echo "All services are stable."

      # ============================================
      # Run database migrations
      # ============================================
      - name: Get VPC and ECS Configuration for Migration Task
        id: vpc-config
        run: |
          # Get migration task definition ARN from CloudFormation exports
          MIGRATION_TASK_ARN=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Migration-Task-ARN'].Value" \
            --output text)
          echo "migration_task_arn=$MIGRATION_TASK_ARN" >> $GITHUB_OUTPUT
          echo "Found migration task: $MIGRATION_TASK_ARN"
          
          # Get private subnet IDs from the VPC
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=tag:aws-cdk:subnet-type,Values=Private" \
            --query 'Subnets[*].SubnetId' \
            --output text | tr '\t' ',')
          
          # Get migration security group ID (exported from CDK stack)
          SECURITY_GROUP=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Migration-SG-ID'].Value" \
            --output text)
          
          echo "subnet_ids=$SUBNET_IDS" >> $GITHUB_OUTPUT
          echo "security_group=$SECURITY_GROUP" >> $GITHUB_OUTPUT

      - name: Run Database Migrations
        if: ${{ github.event.inputs.skip_migrations != 'true' }}
        run: |
          echo "Starting migration task..."
          
          # Run the migration task
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --task-definition ${{ steps.vpc-config.outputs.migration_task_arn }} \
            --launch-type FARGATE\
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.vpc-config.outputs.subnet_ids }}],securityGroups=[${{ steps.vpc-config.outputs.security_group }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Migration task started: $TASK_ARN"
          
          # Wait for the task to complete
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --tasks $TASK_ARN
          
          # Check if the task succeeded
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code: $EXIT_CODE"
            echo "Check logs at /ecs/bearlymail/migration in CloudWatch"
            exit 1
          fi
          
          echo "Migration task completed successfully!"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::789877399450:role/BearlyMail-GitHubActions-DeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          REACT_APP_API_URL: https://api.app.bearlymail.com
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_QUEUE_DASHBOARD_URL: https://queue.api.app.bearlymail.com
        run: npm run build

      - name: Get S3 Bucket and CloudFront Distribution
        id: aws-resources
        run: |
          # Get S3 bucket name from CloudFormation outputs
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name BearlyMailStack \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text)
          
          # Get CloudFront distribution ID
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='BearlyMail frontend distribution'].Id" \
            --output text)
          
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: |
          aws s3 sync client/build/ s3://${{ steps.aws-resources.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.aws-resources.outputs.distribution_id }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://app.bearlymail.com" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://api.app.bearlymail.com" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ steps.aws-resources.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
