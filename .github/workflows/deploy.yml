name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip running migrations'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: bearlymail/server

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789877399450:role/BearlyMail-GitHubActions-DeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          REACT_APP_API_URL: https://api.app.bearlymail.com
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: npm run build

      # ============================================
      # Build and push Docker image to ECR
      # ============================================
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-tag-mutability MUTABLE \
            --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: server
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build --platform linux/amd64 -t ${IMAGE_URI}:latest .
          docker push ${IMAGE_URI}:latest

      # ============================================
      # CDK Deploy (infrastructure changes only)
      # ============================================
      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Deploy Application Stack
        working-directory: infrastructure
        run: |
          cdk deploy BearlyMailStack \
            --require-approval never \
            --outputs-file cdk-outputs.json

      # ============================================
      # Force ECS services to pull the new image
      # ============================================
      - name: Force ECS Service Update
        id: ecs-update
        run: |
          ECS_CLUSTER=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-ECS-Cluster'].Value" \
            --output text)

          WEB_SERVICE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Web-Service-Name'].Value" \
            --output text)

          WORKER_SERVICE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Worker-Service-Name'].Value" \
            --output text)

          echo "ecs_cluster=$ECS_CLUSTER" >> $GITHUB_OUTPUT
          echo "web_service=$WEB_SERVICE" >> $GITHUB_OUTPUT
          echo "worker_service=$WORKER_SERVICE" >> $GITHUB_OUTPUT

          echo "Forcing new deployment on web service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $WEB_SERVICE \
            --force-new-deployment

          echo "Forcing new deployment on worker service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $WORKER_SERVICE \
            --force-new-deployment

      - name: Wait for ECS services to stabilize
        run: |
          echo "Waiting for services to stabilize (this may take a few minutes)..."
          aws ecs wait services-stable \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --services ${{ steps.ecs-update.outputs.web_service }} ${{ steps.ecs-update.outputs.worker_service }}
          echo "All services are stable."

      # ============================================
      # Run database migrations
      # ============================================
      - name: Get VPC and ECS Configuration for Migration Task
        id: vpc-config
        run: |
          # Get migration task definition ARN from CloudFormation exports
          MIGRATION_TASK_ARN=$(aws cloudformation list-exports \
            --query "Exports[?Name=='BearlyMail-Migration-Task-ARN'].Value" \
            --output text)
          echo "migration_task_arn=$MIGRATION_TASK_ARN" >> $GITHUB_OUTPUT
          echo "Found migration task: $MIGRATION_TASK_ARN"
          
          # Get private subnet IDs from the VPC
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=tag:aws-cdk:subnet-type,Values=Private" \
            --query 'Subnets[*].SubnetId' \
            --output text | tr '\t' ',')
          
          # Get security group ID for ECS tasks
          SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=*BearlyMailStack*" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)
          
          echo "subnet_ids=$SUBNET_IDS" >> $GITHUB_OUTPUT
          echo "security_group=$SECURITY_GROUP" >> $GITHUB_OUTPUT

      - name: Run Database Migrations
        if: ${{ github.event.inputs.skip_migrations != 'true' }}
        run: |
          echo "Starting migration task..."
          
          # Run the migration task
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --task-definition ${{ steps.vpc-config.outputs.migration_task_arn }} \
            --launch-type FARGATE\
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.vpc-config.outputs.subnet_ids }}],securityGroups=[${{ steps.vpc-config.outputs.security_group }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Migration task started: $TASK_ARN"
          
          # Wait for the task to complete
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --tasks $TASK_ARN
          
          # Check if the task succeeded
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ steps.ecs-update.outputs.ecs_cluster }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code: $EXIT_CODE"
            echo "Check logs at /ecs/bearlymail/migration in CloudWatch"
            exit 1
          fi
          
          echo "Migration task completed successfully!"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::789877399450:role/BearlyMail-GitHubActions-DeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          REACT_APP_API_URL: https://api.app.bearlymail.com
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: npm run build

      - name: Get S3 Bucket and CloudFront Distribution
        id: aws-resources
        run: |
          # Get S3 bucket name from CloudFormation outputs
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name BearlyMailStack \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text)
          
          # Get CloudFront distribution ID
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='BearlyMail frontend distribution'].Id" \
            --output text)
          
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: |
          aws s3 sync client/build/ s3://${{ steps.aws-resources.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.aws-resources.outputs.distribution_id }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://app.bearlymail.com" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://api.app.bearlymail.com" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ steps.aws-resources.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
