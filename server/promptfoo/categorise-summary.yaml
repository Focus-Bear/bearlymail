  # Test 16: Automated system alert with NO fitting category → Other, NOT a people category
  - description: "Automated monitoring alert — must be Other + proto, never a people category (sanity check)"
    vars:
      senderName: "Datadog Alerts"
      subject: "[ALERT] High error rate on api-prod"
      summary: "Automated monitoring alert: HTTP 5xx error rate exceeded the threshold on service api-prod for the last 5 minutes."
      categories: |
           1. "Customer Support": Help requests and issues from existing customers
           2. "Sales": Sales discussions, pricing, demos
           3. "HR Admin": HR communications and internal admin
      currentDate: "Wednesday, March 18, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const result = parsed?.result;
          if (!result || typeof result.categoryNumber !== 'number') {
            throw new Error("Expected result.categoryNumber, got: " + JSON.stringify(parsed));
          }
          if (result.categoryNumber === 1) {
            throw new Error(`Automated alert wrongly placed in "Customer Support" people category. Explanation: ${result.categoryExplanation}`);
          }
          if (result.categoryNumber !== 0) {
            throw new Error(`Expected Other (0) for automated alert with no fitting category, got ${result.categoryNumber}. Explanation: ${result.categoryExplanation}`);
          }
