description: "Email categorisation accuracy — batch vs single-email parity (fix #1144)"

providers:


  - id: google:gemini-3.1-flash-lite
    config:
      temperature: 0
 
prompts:
  - file://prompts/prioritise-email.md

tests:
  # Production-shaped coverage: one call must distinguish many obvious categories
  # without collapsing onto sender/platform or confusing neighbouring outcomes.
  - description: "Large mixed batch — classify 12 emails against the exported 98-category taxonomy"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "order") ---
        From: Focus Bear Store <orders@focusbear.io>
        Subject: New physical product order #4821
        Summary: A customer ordered two Focus Bear buttons. Pack and ship the order to the supplied address.

        --- EMAIL 2 (key: "monitoring") ---
        From: F5Bot <alerts@f5bot.com>
        Subject: New web mention for Focus Bear
        Summary: Focus Bear was mentioned in a Reddit discussion about productivity apps.

        --- EMAIL 3 (key: "regulatory") ---
        From: Australian regulator <updates@regulator.gov.au>
        Subject: Mandatory privacy reporting requirements changed
        Summary: Official notice of new compliance obligations taking effect next quarter.

        --- EMAIL 4 (key: "project-update") ---
        From: Alex <alex@focusbear.io>
        Subject: Accessibility project weekly update
        Summary: The team completed the settings screen and will start usability testing tomorrow.

        --- EMAIL 5 (key: "personal-outreach") ---
        From: Sam <sam@example.com>
        Subject: Idea for an ADHD-friendly app feature
        Summary: I enjoyed meeting you and wanted to share a personal idea for improving the app.

        --- EMAIL 6 (key: "sentry") ---
        From: Sentry <alerts@sentry.io>
        Subject: TypeError rate increased in production
        Summary: Automated alert: 84 new occurrences of an unhandled TypeError in the web application.

        --- EMAIL 7 (key: "new-human-issue") ---
        From: Jamie via GitHub <notifications@github.com>
        Subject: New issue #812: keyboard shortcut opens wrong view
        Summary: Jamie, a human team member, opened a new GitHub issue describing a reproducible UI bug. It is not QA or customer feedback.

        --- EMAIL 8 (key: "merged") ---
        From: GitHub <notifications@github.com>
        Subject: Pull request #923 was merged
        Summary: The pull request was successfully merged into main and the branch was deleted.

        --- EMAIL 9 (key: "app-store") ---
        From: App Store Connect <no_reply@email.apple.com>
        Subject: Focus Bear version 4.2 is ready for sale
        Summary: Automated App Store Connect notification confirming review completion and release status.

        --- EMAIL 10 (key: "bearly-bot") ---
        From: codex[bot] via GitHub <notifications@github.com>
        Subject: Re: BearlyMail PR #1012 automated review
        Summary: Automated code review found two potential null-handling issues in the BearlyMail repository.

        --- EMAIL 11 (key: "bounce") ---
        From: Mail Delivery Subsystem <mailer-daemon@example.com>
        Subject: Delivery Status Notification (Failure)
        Summary: Your message could not be delivered because the recipient address does not exist.

        --- EMAIL 12 (key: "upwork") ---
        From: Upwork <notifications@upwork.com>
        Subject: Your job post is now live
        Summary: Automated platform notification confirming the contractor job posting is visible to freelancers.
      emailCategories: file://fixtures/exported-email-categories-2026-08-02.txt
      urgentContext: "Active production outages and security compromises"
      notUrgentContext: "Newsletters and routine delivery notices"
      goalsContext: "Keep production reliable and respond quickly to customers"
      workingOnContext: "Enterprise sales and platform reliability"
      dontCareContext: "Promotional roundups"
      currentDate: "Monday, August 3, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const results = parsed?.prioritised_emails;
          if (!Array.isArray(results) || results.length !== 12) {
            throw new Error(`Expected 12 categorised emails, got ${results?.length ?? 0}: ${JSON.stringify(parsed)}`);
          }
          const expected = {
            order: '📦 Order Fulfillment',
            monitoring: '🔔 Keyword Monitoring Alerts',
            regulatory: '⚖️ Regulatory & Compliance Updates',
            'project-update': '💬 Project Updates',
            'personal-outreach': '📧 Personal Outreach',
            sentry: '🖥️ System & Error Alerts',
            'new-human-issue': '🆕 New Human-Created GitHub Issues',
            merged: '✅ PR Merged Notifications',
            'app-store': '🚀 App Store Notifications',
            'bearly-bot': '🤖 BearlyMail Automated Bot Comments',
            bounce: '📧 Email Delivery Failures',
            upwork: '💼 Upwork Platform Notifications'
          };
          for (const [key, category] of Object.entries(expected)) {
            const item = results.find(result => result.key === key);
            if (!item) throw new Error(`Missing result for ${key}`);
            if (item.category !== category) {
              throw new Error(`${key} was classified as "${item.category}"; expected "${category}". ${item.categoryExplanation ?? ''}`);
            }
          }
          return true;

  # Test 1: GitHub bot PR must NOT land in a "from humans" category
  - description: "GitHub bot PR — must go to a GitHub bot/automation category, not human category"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "bot-pr-1") ---
        From: github-actions[bot]
        Subject: PR opened: Add new feature
        Summary: Automated PR opened by github-actions[bot] to add a new feature to the codebase.
      emailCategories: |
           - "Code reviews by human developers": Pull requests opened or reviewed by human developers — NOT bots
           - "GitHub bot notifications": Automated notifications from GitHub bots and CI/CD systems
           - "Devin PRs": Pull requests created by Devin AI
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Wednesday, March 18, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const results = parsed?.prioritised_emails;
          if (!Array.isArray(results) || results.length === 0) {
            throw new Error("Expected prioritised_emails array, got: " + JSON.stringify(parsed));
          }
          const item = results[0];
          if (item.category === "Code reviews by human developers") {
            throw new Error(`Bot PR misassigned to human-only category. categoryExplanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 2: Devin PR must be categorised as "Devin PRs" even when latest message is from a human
  - description: "Devin PR thread — category determined by PR initiator, not latest message author"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "devin-pr-1") ---
        From: Jeremy (via GitHub)
        Subject: Re: PR merged — Add new feature (Devin)
        Summary: PR created by Devin AI was merged by Jeremy. Thread started with Devin opening the PR.
      emailCategories: |
           - "Code reviews by human developers": PRs opened or reviewed by humans
           - "Devin PRs": Pull requests created by Devin AI
           - "GitHub bot notifications": Automated GitHub system notifications
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Wednesday, March 18, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const results = parsed?.prioritised_emails;
          if (!Array.isArray(results) || results.length === 0) {
            throw new Error("Expected prioritised_emails array, got: " + JSON.stringify(parsed));
          }
          const item = results[0];
          if (item.category !== "Devin PRs") {
            throw new Error(`Devin PR thread miscategorised as "${item.category}". Expected "Devin PRs". Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 3: Batch returns correct key mapping
  - description: "Batch response includes correct emailKey for each result"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "newsletter-abc") ---
        From: Weekly Digest <digest@techblog.com>
        Subject: This week in tech — top stories
        Summary: Weekly newsletter with tech news digest. No action required.

        --- EMAIL 2 (key: "support-xyz") ---
        From: Jane Smith <jane@customer.com>
        Subject: URGENT: My account is locked
        Summary: Customer reports account lockout, cannot log in. Needs immediate help.
      emailCategories: |
           - "Newsletters": Marketing emails, digests, promotional content
           - "Customer Support": Support requests, customer issues, help requests
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Wednesday, March 18, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const results = parsed?.prioritised_emails;
          if (!Array.isArray(results) || results.length !== 2) {
            throw new Error("Expected 2 results, got: " + JSON.stringify(parsed));
          }
          const keys = results.map(r => r.key);
          if (!keys.includes("newsletter-abc")) {
            throw new Error("Missing key 'newsletter-abc'. Keys found: " + keys.join(", "));
          }
          if (!keys.includes("support-xyz")) {
            throw new Error("Missing key 'support-xyz'. Keys found: " + keys.join(", "));
          }
          const newsletter = results.find(r => r.key === "newsletter-abc");
          if (newsletter.urgencyScore > 10) {
            throw new Error(`Newsletter should have urgencyScore <= 10, got ${newsletter.urgencyScore}`);
          }
          return true;

  # Test 4: QA bot pass email → ✅ QA passed issues (content-based role override)
  - description: "QA bot pass result — content-based role override routes to QA passed category"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "qa-bot-pass-1") ---
        From: professor-reproducible[bot]
        Subject: Re: Bug #456 — Login button broken
        Summary: QA bot tested the fix for Bug #456. Test PASSED — the login button now works correctly. Issue verified as fixed.
      emailCategories: |
           - "✅ QA passed issues": Issues where QA has verified the fix works
           - "QA failed issues": Issues where QA testing found the fix doesn't work
           - "🐛 New GitHub issues (bot-created)": Issues automatically created by bots
           - "Code reviews by human developers": PRs opened or reviewed by humans — NOT bots
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Friday, March 20, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          if (item.category !== '✅ QA passed issues') {
            throw new Error(`QA bot pass misclassified as "${item.category}". Expected "✅ QA passed issues". Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 5: QA bot fail email → QA failed issues (uses DIFFERENT bot name to prove generality)
  - description: "QA bot fail result — content-based role override routes to QA failed category (proves generality with different bot name)"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "qa-bot-fail-1") ---
        From: some-future-qa-bot[bot]
        Subject: Re: Bug #789 — Crash on settings page
        Summary: Automated QA testing of Bug #789 fix. Test FAILED — the crash still occurs when opening settings on iOS 18.
      emailCategories: |
           - "✅ QA passed issues": Issues where QA has verified the fix works
           - "QA failed issues": Issues where QA testing found the fix doesn't work
           - "🐛 New GitHub issues (bot-created)": Issues automatically created by bots
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Friday, March 20, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          if (item.category !== 'QA failed issues') {
            throw new Error(`QA bot fail misclassified as "${item.category}". Expected "QA failed issues". Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 6: CI bot notification → NOT a QA category (regression guard)
  - description: "CI bot notification — still routes to bot/notification category, not QA (regression guard)"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "ci-bot-1") ---
        From: github-actions[bot]
        Subject: CI run completed — Build #1234
        Summary: CI pipeline completed. All checks passed. Build artifacts uploaded.
      emailCategories: |
           - "✅ QA passed issues": Issues where QA has verified the fix works
           - "QA failed issues": Issues where QA testing found the fix doesn't work
           - "🐛 New GitHub issues (bot-created)": Issues automatically created by bots
           - "GitHub bot notifications": Automated notifications from GitHub bots and CI/CD systems
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Friday, March 20, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          if (item.category === '✅ QA passed issues' || item.category === 'QA failed issues') {
            throw new Error(`CI bot notification misclassified as QA category "${item.category}". CI notifications should route to a bot/notification category, not QA. Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 7: Spanish email with "datos" → NOT "Build/deployment errors" (#1287)
  - description: "Spanish email with 'datos' — must NOT be miscategorised as Build/deployment errors"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "spanish-datos-1") ---
        From: Andrea López <andrea@focusbear.io>
        Subject: Pregunta sobre exportación de datos
        Summary: Hola equipo, tengo una pregunta sobre la exportación de datos de usuario. ¿Es posible descargar los datos en formato CSV? Necesito los datos de actividad de los últimos 3 meses para un informe. También quiero saber si la conexión con la API permite extraer datos automáticamente. Gracias.
      emailCategories: |
           - "Customer Support": Support requests, customer issues, help requests
           - "Build/deployment errors": Build failures, deployment issues, CI/CD errors
           - "Security & Compliance": Security alerts, compliance issues, privacy concerns
           - "Newsletters": Marketing emails, digests, promotional content
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Friday, March 20, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          if (item.category === 'Build/deployment errors') {
            throw new Error(`Spanish email with "datos" misclassified as "${item.category}". "datos" is Spanish for "data", not a build error. Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 8: Email with GDPR footer → NOT "Security & Compliance" (#1288)
  - description: "Product question with GDPR footer — must NOT be miscategorised as Security & Compliance"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "gdpr-footer-1") ---
        From: Andrea López <andrea@focusbear.io>
        Subject: Question about Focus Bear pricing plans
        Summary: Hi team, I wanted to ask about upgrading our team plan from 5 to 15 seats. Can you send me the pricing details? We're also interested in the annual billing option. Thanks! Andrea

        ---
        This email and any attachments are confidential. If you received this in error, please delete it. We process personal data in accordance with our Privacy Policy (https://example.com/privacy). To unsubscribe from these communications, click here: https://example.com/unsubscribe. For information about how we handle your data under GDPR, visit https://example.com/gdpr.
      emailCategories: |
           - "Customer Support": Support requests, customer issues, help requests
           - "Sales": Sales discussions, pricing requests, demos
           - "Security & Compliance": Security alerts, compliance issues, privacy concerns
           - "Newsletters": Marketing emails, digests, promotional content
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Friday, March 20, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          if (item.category === 'Security & Compliance') {
            throw new Error(`Email with GDPR footer misclassified as "${item.category}". The GDPR footer is boilerplate — the actual email is a pricing question. Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 9: Actual security email with footer → SHOULD be "Security & Compliance" (regression guard)
  - description: "Genuine security email with GDPR footer — must still be categorised as Security & Compliance"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "real-security-1") ---
        From: Security Team <security@example.com>
        Subject: URGENT: Potential data breach detected in production
        Summary: We detected unauthorized access to the production database at 03:42 UTC today. Approximately 2,300 user records may have been exposed including email addresses and hashed passwords. We have rotated all credentials and blocked the source IP. Please review the incident report and confirm whether we need to notify affected users under GDPR Article 33 obligations. Immediate action required.

        ---
        This email and any attachments are confidential. If you received this in error, please delete it. We process personal data in accordance with our Privacy Policy (https://example.com/privacy). To unsubscribe from these communications, click here: https://example.com/unsubscribe. For information about how we handle your data under GDPR, visit https://example.com/gdpr.
      emailCategories: |
           - "Customer Support": Support requests, customer issues, help requests
           - "Sales": Sales discussions, pricing requests, demos
           - "Security & Compliance": Security alerts, compliance issues, privacy concerns
           - "Newsletters": Marketing emails, digests, promotional content
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Friday, March 20, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          if (item.category !== 'Security & Compliance') {
            throw new Error(`Genuine security email misclassified as "${item.category}". A real data breach report should be "Security & Compliance" even with a GDPR footer. Explanation: ${item.categoryExplanation}`);
          }
          return true;

  # Test 10: Jira notification about a bug → Jira category, NOT "Customer feedback" (cross-platform signal-extraction)
  - description: "Jira bug notification — platform identity (Jira) takes priority over content topic (bug)"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "jira-bug-1") ---
        From: Jira <jira@atlassian.net>
        Subject: "[BEAR-123] Login button does not work on iOS 17"
        Summary: A new issue was created in Jira by a customer: "Login button does not work on iOS 17". Severity: High. Reporter: user@example.com. View on Jira: https://focusbear.atlassian.net/browse/BEAR-123
      emailCategories: |
           - "Customer feedback": Feature requests and feedback submitted directly by customers via email
           - "Jira tickets": Issues and notifications from Jira / Atlassian
           - "GitHub bot notifications": Automated notifications from GitHub bots and CI/CD systems
           - "Customer Support": Direct support requests from customers via email
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Monday, March 23, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          // Hard failure: a Jira notification must NOT be treated as direct customer feedback
          // (it came via Jira, not directly from the customer by email)
          if (item.category === 'Customer feedback') {
            throw new Error(`Jira bug notification misclassified as "${item.category}". Platform identity (Jira) must take priority over content topic. Explanation: ${item.categoryExplanation}`);
          }
          // Accept "Jira tickets" (preferred) OR "Customer Support" (defensible: it IS a bug report
          // from a customer, and the compressed prompt may not always distinguish Jira vs email support)
          return true;

  # Test 11: Slack digest notification → Slack category, NOT "HR Admin" (cross-platform: Slack)
  - description: "Slack digest — platform identity (Slack) takes priority over content topic (team/HR-adjacent)"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "slack-digest-1") ---
        From: Slack <no-reply@slack.com>
        Subject: "Your Slack digest: 3 unread messages in #team-general"
        Summary: You have 3 unread messages in #team-general on the Focus Bear Slack workspace. Topics include upcoming team offsite planning, public holiday policy reminder, and a new hire announcement. View in Slack: https://focusbear.slack.com
      emailCategories: |
           - "HR Admin": HR communications, admin tasks, internal company matters, policies
           - "Slack messages": Notifications and digests from Slack
           - "Newsletters": Marketing emails, digests, promotional content
           - "Customer Support": Support requests, customer issues
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Monday, March 23, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          // Hard failure: Slack digest must NOT be treated as HR Admin content
          // (platform identity: Slack notification trumps HR-adjacent content topic)
          if (item.category === 'HR Admin') {
            throw new Error(`Slack digest misclassified as "${item.category}". Platform identity (Slack) must take priority. Explanation: ${item.categoryExplanation}`);
          }
          // Accept "Slack messages" (preferred) OR "Newsletters" (defensible: it IS a digest/digest
          // format, and the compressed prompt may categorise it as a notification digest)
          return true;

  # Test 12: GitHub issue about a feature request → GitHub category, NOT "Customer feedback" (platform > topic)
  - description: "GitHub issue notification about feature request — platform (GitHub) beats topic (customer feedback)"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "github-feature-1") ---
        From: notifications@github.com
        Subject: "[Focus-Bear/BearlyMail] Feature request: Dark mode support (#999)"
        Summary: A new GitHub issue was opened by user@example.com requesting dark mode support for BearlyMail. The user describes wanting a dark theme for use at night. View on GitHub: https://github.com/Focus-Bear/BearlyMail/issues/999
      emailCategories: |
           - "Customer feedback": Feature requests and feedback submitted directly by customers via email or feedback forms — NOT via GitHub issues
           - "GitHub bot notifications": Automated notifications from GitHub bots and CI/CD systems
           - "New GitHub issues (human-created)": New issues opened on GitHub by humans
           - "Customer Support": Direct support requests from customers
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Monday, March 23, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          // Hard failure: a GitHub issue must NOT be classified as "Customer feedback" —
          // the category explicitly states "NOT via GitHub issues"
          if (item.category === 'Customer feedback') {
            throw new Error(`GitHub feature request misclassified as "${item.category}". The category says "NOT via GitHub issues" — platform identity must take precedence. Explanation: ${item.categoryExplanation}`);
          }
          // Accept "New GitHub issues (human-created)" (preferred), "GitHub bot notifications"
          // (reasonable: came from notifications@github.com), or "Customer Support" (defensible:
          // it IS a feature request/user need). Only exclude the explicitly wrong category.
          return true;

  # Test 13: Dependabot PR (GitHub) → "GitHub bot notifications", NOT "Code reviews by human developers"
  - description: "Dependabot dependency update PR — automated bot, not a human code review"
    vars:
      batchMode: true
      emailBatch: |
        --- EMAIL 1 (key: "dependabot-pr-1") ---
        From: notifications@github.com
        Subject: "[Focus-Bear/BearlyMail] Bump lodash from 4.17.20 to 4.17.21 (#1001)"
        Summary: Dependabot opened a pull request to bump lodash from 4.17.20 to 4.17.21 to fix a known prototype pollution vulnerability. Automated security update. View on GitHub: https://github.com/Focus-Bear/BearlyMail/pull/1001
      emailCategories: |
           - "Code reviews by human developers": Pull requests opened or reviewed by human developers — NOT bots
           - "GitHub bot notifications": Automated notifications from GitHub bots and CI/CD systems
           - "Devin PRs": Pull requests created by Devin AI
           - "Security & Compliance": Security alerts, compliance issues
      urgentContext: ""
      notUrgentContext: ""
      goalsContext: ""
      workingOnContext: ""
      dontCareContext: ""
      currentDate: "Monday, March 23, 2026"
    assert:
      - type: javascript
        value: |
          const parsed = typeof output === 'string'
            ? JSON.parse(output.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim())
            : output;
          const item = parsed?.prioritised_emails?.[0];
          // Hard failure: Dependabot is a bot — can NEVER be in a "code reviews by humans" category
          if (item.category === 'Code reviews by human developers') {
            throw new Error(`Dependabot PR misclassified as "${item.category}". Dependabot is a bot — not eligible for human developer category. Explanation: ${item.categoryExplanation}`);
          }
          // Accept any other category. Dependabot PRs are defensibly classified as:
          // - "GitHub bot notifications" (preferred: it's a GitHub bot)
          // - "Security & Compliance" (also reasonable: the PR fixes a known security vulnerability)
          // - "Devin PRs" (marginal: LLMs may conflate AI/automated PRs)
          // The ONLY hard invariant is that Dependabot must NOT land in a human-code-review category.
          return true;
