description: "Tests for the category shortlist prompt (cheap pre-filter that picks the top-N most relevant categories before the smart model)"

prompts:
  - file://prompts/category-shortlist.md

providers:
  - id: google:gemini-3.1-flash-lite
    config:
      temperature: 0

# Shared category list (GitHub-heavy, mirrors a real power-user account) and topN.
# Per-test vars override the email fields.
defaultTest:
  vars:
    topN: "10"
    categories: |
      - [id: human_github_bug_reports] "Human GitHub bug reports": Bug reports filed by humans on GitHub.
      - [id: human_github_issue_status] "Human GitHub issue status updates": Human comments and status updates on GitHub issues.
      - [id: github_bot_notifications] "GitHub bot notifications": Automated notifications from GitHub bots.
      - [id: github_pr_updates] "GitHub PR Updates": Pull request activity such as reviews, comments and merges.
      - [id: qa_passed_issues] "QA passed issues": Notifications where a QA or tester confirms an existing GitHub issue/bug has been tested and marked as fixed (pass).
      - [id: qa_failed_issues] "QA failed issues": Notifications where a QA or tester has marked a GitHub issue as failed.
      - [id: dev_github_issue_comments] "Dev GitHub issue comments": Developer comments on GitHub issues.
      - [id: closed_github_issue_notifications] "Closed GitHub Issue Notifications": Notifications that a GitHub issue was closed.
      - [id: github_project_access] "GitHub Project & Access Requests": Project board and repository access requests.
      - [id: sentry_alerts] "Automated System Alerts from Sentry": Automated error alerts from Sentry.
      - [id: customer_feedback] "Customer feedback": Feedback from customers, not GitHub issues.
      - [id: industry_news] "Industry News & Marketing": Newsletters and marketing emails.
      - [id: invoices_billing] "Invoices and Billing": Invoices and payment receipts.

tests:
  - description: "Returns a JSON object with a categories array of at most topN known ids, excluding Other"
    vars:
      fromName: "GitHub"
      subject: "Re: [Focus-Bear/Mac-App] Blocking schedule disappears (Issue #1664)"
      summary: "A contributor left a comment on a GitHub issue about a blocking-schedule bug."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output : JSON.stringify(output);
          const parsed = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
          if (!Array.isArray(parsed.categories)) {
            throw new Error('Expected a categories array');
          }
          if (parsed.categories.length > 10) {
            throw new Error(`Expected at most topN (10) categories, got ${parsed.categories.length}`);
          }
          const known = new Set(['human_github_bug_reports','human_github_issue_status','github_bot_notifications','github_pr_updates','qa_passed_issues','qa_failed_issues','dev_github_issue_comments','closed_github_issue_notifications','github_project_access','sentry_alerts','customer_feedback','industry_news','invoices_billing']);
          for (const id of parsed.categories) {
            if (typeof id !== 'string' || !known.has(id)) {
              throw new Error(`Returned unknown/invented id: ${JSON.stringify(id)}`);
            }
          }
          if (parsed.categories.some(id => String(id).toLowerCase() === 'other')) {
            throw new Error('Must not include "Other"');
          }
          return true;

  - description: "Surfaces 'QA passed issues' for a QA pass-verification comment (the category name lacks the word 'github')"
    vars:
      fromName: "Ekaterine Mitagvaria"
      subject: "Re: [Focus-Bear/Mac-App] Blocking schedule disappears (Issue #1664)"
      summary: |
        A QA tester reports they re-tested the blocking-schedule bug across 6 scenarios on
        macOS and confirms it now persists correctly. Result: 6/6 scenarios passed. QA status:
        Pass. The issue is verified fixed; no further developer action is required.
    assert:
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output : JSON.stringify(output);
          const parsed = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
          if (!parsed.categories.includes('qa_passed_issues')) {
            throw new Error(`Expected 'qa_passed_issues' in the shortlist, got: ${JSON.stringify(parsed.categories)}`);
          }
          return true;

  - description: "Surfaces 'QA failed issues' for a QA fail-verification comment"
    vars:
      fromName: "Ekaterine Mitagvaria"
      subject: "Re: [Focus-Bear/Mac-App] Timer resets unexpectedly (Issue #1701)"
      summary: |
        A QA tester reports the timer-reset bug still reproduces on the latest build. Result:
        2/6 scenarios passed. QA status: Fail. Sending back to the developer to fix.
    assert:
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output : JSON.stringify(output);
          const parsed = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
          if (!parsed.categories.includes('qa_failed_issues')) {
            throw new Error(`Expected 'qa_failed_issues' in the shortlist, got: ${JSON.stringify(parsed.categories)}`);
          }
          return true;

  - description: "Surfaces 'GitHub PR Updates' for a pull-request notification"
    vars:
      fromName: "GitHub"
      subject: "Re: [Focus-Bear/Mac-App] Fix blocking schedule persistence (PR #1702)"
      summary: |
        A reviewer requested changes on a pull request and the author pushed a new commit.
        The pull request is awaiting re-review before it can be merged.
    assert:
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output : JSON.stringify(output);
          const parsed = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
          if (!parsed.categories.includes('github_pr_updates')) {
            throw new Error(`Expected 'github_pr_updates' in the shortlist, got: ${JSON.stringify(parsed.categories)}`);
          }
          return true;

  - description: "Surfaces 'Invoices and Billing' for a payment receipt (non-GitHub email)"
    vars:
      fromName: "Stripe"
      subject: "Your receipt from Focus Bear"
      summary: "A payment receipt confirming a successful subscription charge, with an invoice number and amount."
    assert:
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output : JSON.stringify(output);
          const parsed = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
          if (!parsed.categories.includes('invoices_billing')) {
            throw new Error(`Expected 'invoices_billing' in the shortlist, got: ${JSON.stringify(parsed.categories)}`);
          }
          return true;
