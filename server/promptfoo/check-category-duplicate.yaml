description: "Tests for the list-based category duplicate detection prompt used by proto-category deduplication"

providers:
  - id: google:gemini-3.1-flash-lite
    config:
      temperature: 0

prompts:
  - file://prompts/check-category-duplicate.md

tests:
  - description: "Should return valid JSON with duplicateNumber and reasoning fields"
    vars:
      newCategory: "CI/CD Alerts"
      categoryList: "1. Receipts\n2. CI/CD Notifications\n3. Meeting scheduling"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (!Number.isInteger(parsed.duplicateNumber)) {
            throw new Error(`Expected duplicateNumber integer, got: ${typeof parsed.duplicateNumber}`);
          }
          if (typeof parsed.reasoning !== 'string' || parsed.reasoning.trim() === '') {
            throw new Error(`Expected non-empty reasoning string, got: ${typeof parsed.reasoning}`);
          }
          return true;

  - description: "Reasoning should be no longer than 20 words"
    vars:
      newCategory: "Marketing Emails"
      categoryList: "1. Invoices\n2. Promotional Newsletters\n3. Project Updates"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          const wordCount = parsed.reasoning.trim().split(/\s+/).length;
          if (wordCount > 20) {
            throw new Error(`Reasoning exceeded 20 words: got ${wordCount} words: "${parsed.reasoning}"`);
          }
          return true;

  - description: "Should detect typo/minor spelling variant as duplicate (picks its number)"
    vars:
      newCategory: "CI/CD Alerts"
      categoryList: "1. Receipts\n2. CICD Alerts\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 2) {
            throw new Error(`Expected duplicateNumber=2 for typo variant, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should detect paraphrase as duplicate (CI/CD Alerts vs CI/CD Notifications)"
    vars:
      newCategory: "CI/CD Alerts"
      categoryList: "1. Receipts\n2. CI/CD Notifications\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 2) {
            throw new Error(`Expected duplicateNumber=2 for paraphrase, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should detect plural/singular variant as duplicate"
    vars:
      newCategory: "Invoice"
      categoryList: "1. Newsletters\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 2) {
            throw new Error(`Expected duplicateNumber=2 for plural/singular variant, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should NOT mark meaningfully different categories as duplicate"
    vars:
      newCategory: "Newsletters"
      categoryList: "1. Project Updates\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 0) {
            throw new Error(`Expected duplicateNumber=0 for unrelated categories, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should NOT mark similar-sounding but distinct entity categories as duplicate (Project Alpha vs Project Beta)"
    vars:
      newCategory: "Project Alpha"
      categoryList: "1. Project Beta\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 0) {
            throw new Error(`Expected duplicateNumber=0 for distinct project names, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should NOT mark broad umbrella vs distinct sub-topic as duplicate (GitHub Notifications vs generic Notifications umbrella)"
    vars:
      newCategory: "GitHub Notifications"
      categoryList: "1. Notifications\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 0) {
            throw new Error(`Expected duplicateNumber=0 when only match is a generic umbrella, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should detect same concept with different wording as duplicate (Job Applications vs Career Opportunities)"
    vars:
      newCategory: "Job Applications"
      categoryList: "1. Receipts\n2. Career Opportunities\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 2) {
            throw new Error(`Expected duplicateNumber=2 for same concept different wording, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should NOT merge same-platform sub-categories that track different artifacts (PR updates vs new issues)"
    vars:
      newCategory: "GitHub PR Updates"
      categoryList: "1. New GitHub issues (bot-created)\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 0) {
            throw new Error(`Expected duplicateNumber=0 for PR-updates vs issues, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should NOT merge same-platform same-artifact sub-categories that differ on author kind (bot vs human PRs)"
    vars:
      newCategory: "GitHub Bot PR Updates"
      categoryList: "1. GitHub PR Updates\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 0) {
            throw new Error(`Expected duplicateNumber=0 for bot-vs-human PR updates, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should NOT merge same-platform sub-categories that track different artifacts (PR reviews vs issue comments)"
    vars:
      newCategory: "GitHub PR Reviews"
      categoryList: "1. GitHub Issue Comments\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 0) {
            throw new Error(`Expected duplicateNumber=0 for PR-reviews vs issue-comments, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should collapse source-specific newsletters into the generic bucket (AI Weekly vs TechCrunch Newsletter)"
    vars:
      newCategory: "AI Weekly"
      categoryList: "1. TechCrunch Newsletter\n2. Invoices\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 1) {
            throw new Error(`Expected duplicateNumber=1 for two source-specific newsletters, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should collapse source-specific receipts into the generic bucket (Uber receipt vs Amazon receipt)"
    vars:
      newCategory: "Uber receipt"
      categoryList: "1. Newsletters\n2. Amazon receipt\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 2) {
            throw new Error(`Expected duplicateNumber=2 for two source-specific receipts, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;

  - description: "Should detect cold-outreach paraphrase as duplicate despite added qualifier and directional phrasing (Cold Sales Outreach vs Cold outreach: from others to me)"
    vars:
      newCategory: "Cold Sales Outreach"
      categoryList: "1. Receipts\n2. Cold outreach: from others to me\n3. Meeting scheduling"
    assert:
      - type: javascript
        value: |
          const cleaned = output.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleaned);
          if (parsed.duplicateNumber !== 2) {
            throw new Error(`Expected duplicateNumber=2 for cold-outreach paraphrase, got: ${parsed.duplicateNumber}. Reasoning: ${parsed.reasoning}`);
          }
          return true;
