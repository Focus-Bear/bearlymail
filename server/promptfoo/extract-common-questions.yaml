description: "Common questions (learned FAQ) extraction prompts for BearlyMail"

providers:
  - id: google:gemini-3.1-flash-lite
    config:
      temperature: 0

prompts:
  - file://prompts/extract-common-questions.md

defaultTest:
  options:
    transform: |
      const text = typeof output === 'string' ? output : JSON.stringify(output);
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if (start === -1 || end === -1) throw new Error('No JSON object in output');
      const parsed = JSON.parse(text.slice(start, end + 1));
      if (!Array.isArray(parsed.qa_pairs)) throw new Error('Missing qa_pairs array');
      return parsed.qa_pairs;

# A made-up dog-grooming business; no real mail.
tests:
  - description: "Groups the same question from two different people and answers in the user's words"
    vars:
      pairsText: |
        [1] Asked by: Person 1
        Subject: Saturday grooming?
        Question: Hi there, do you have any appointments on Saturdays? Biscuit gets anxious when the salon is busy on weekdays.
        User's reply: Hi Alice, yes, we're open Saturdays 9am to 3pm. Saturday slots book out about two weeks ahead, so grab one at https://sunnypaws.example/book soon.

        ---

        [2] Asked by: Person 2
        Subject: Weekend hours
        Question: Are you open on weekends at all? Work makes weekday drop-offs really tricky for me.
        User's reply: Hi Ben, yes, we're open Saturdays 9am to 3pm and closed on Sundays. You can book online at https://sunnypaws.example/book.

        ---

        [3] Asked by: Person 3
        Subject: Price for a big dog
        Question: How much is a full groom for a large dog like a golden retriever?
        User's reply: Hi Chloe, a full groom for a large dog is $95 and takes about two and a half hours. Matted coats can cost a little more.
    assert:
      - type: javascript
        value: |
          if (output.length !== 1) throw new Error(`Expected exactly one FAQ, got ${JSON.stringify(output)}`);
          const [faq] = output;
          const ids = [...faq.pairIds].sort();
          if (ids.join(',') !== '1,2') throw new Error(`Expected pairIds [1,2], got ${faq.pairIds}`);
          if (!faq.question.trim().endsWith('?')) throw new Error(`Not a question: ${faq.question}`);
          if (!/9\s?am/i.test(faq.answer) || !/3\s?pm/i.test(faq.answer)) throw new Error(`Answer lost the hours: ${faq.answer}`);
          if (/\$|sunday.*open/i.test(faq.answer)) throw new Error(`Answer added facts: ${faq.answer}`);
          return true;

  - description: "One person asking twice is not an FAQ"
    vars:
      pairsText: |
        [1] Asked by: Person 1
        Subject: Parking
        Question: Is there parking near you? I'll have two dogs with me.
        User's reply: Hi Dan, yes, there's free two-hour parking right out front on Elm Street.

        ---

        [2] Asked by: Person 1
        Subject: Parking again
        Question: Sorry, me again. Where is the best place to park on a Saturday?
        User's reply: No worries Dan, the free two-hour parking out front on Elm Street is the best spot.
    assert:
      - type: javascript
        value: |
          if (output.length !== 0) throw new Error(`Expected no FAQs, got ${JSON.stringify(output)}`);
          return true;

  - description: "Meeting acceptances and status chatter are not FAQs"
    vars:
      pairsText: |
        [1] Asked by: Person 1
        Subject: Team lunch Friday
        Question: Are you coming to the team lunch on Friday?
        User's reply: Yes, I'll be there. Looking forward to it, see you all on Friday!

        ---

        [2] Asked by: Person 2
        Subject: Supplier catch-up
        Question: Can you make the supplier catch-up on Tuesday?
        User's reply: Yes, I can attend. Thanks for the invite, I'll bring the price list.

        ---

        [3] Asked by: Person 3
        Subject: Quick one
        Question: Did you get my email from yesterday?
        User's reply: Got it, thanks! I'll get back to you later this week once I've had a look.
    assert:
      - type: javascript
        value: |
          if (output.length !== 0) throw new Error(`Expected no FAQs, got ${JSON.stringify(output)}`);
          return true;
