# PromptFoo test configuration for custom label identification prompt

description: "Tests for custom label identification prompt used in email scanning"

prompts:
  - file://prompts/identify-custom-labels.md

providers:
  - id: openai:gpt-5-mini
    config:
      reasoning_effort: low
      temperature: 0.3
      max_tokens: 1000

tests:
  - description: "Should identify custom project labels"
    vars:
      labels: |
        INBOX
        SENT
        Project Alpha
        Website Redesign
        UNREAD
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 2;
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.some(item => item.label === 'Project Alpha' && item.confidence === 'HIGH');
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.every(item => item.categoryName && item.description && item.confidence);

  - description: "Should ignore all system labels"
    vars:
      labels: |
        INBOX
        SENT
        TRASH
        SPAM
        DRAFT
        UNREAD
        STARRED
        IMPORTANT
        CATEGORY_PERSONAL
        CATEGORY_SOCIAL
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 0;

  - description: "Should identify client/company labels"
    vars:
      labels: |
        INBOX
        Acme Corp
        Client Smith
        Partner XYZ
        SENT
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 3;
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.every(item => ['HIGH', 'MEDIUM', 'LOW'].includes(item.confidence));

  - description: "Should identify topic/workflow labels"
    vars:
      labels: |
        Invoices
        Travel
        Legal
        To Review
        Follow Up
        Urgent
        CATEGORY_UPDATES
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 6;
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.some(item => item.label === 'Invoices' && item.categoryName.includes('💰'));

  - description: "Should filter out BearlyMail-created labels"
    vars:
      labels: |
        SnoozedBearlyMail
        VA-to-action
        BearlyMail-Blocked
        Project Alpha
        Client Work
        INBOX
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 2;
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return !parsed.some(item => item.label.includes('BearlyMail') || item.label.includes('VA-'));

  - description: "Should handle mixed case and spaces"
    vars:
      labels: |
        inbox
        Marketing Campaign 2024
        Q1 Budget Review
        sent
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 2;
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.every(item => item.categoryName && item.categoryName.length > 0);

  - description: "Should add emoji prefixes appropriately"
    vars:
      labels: |
        Invoices
        Legal Documents
        Travel Expenses
        Project Alpha
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.every(item => item.categoryName.match(/[\p{Emoji}]/u) || item.categoryName === item.label);

  - description: "Should return empty array for no custom labels"
    vars:
      labels: |
        INBOX
        SENT
        TRASH
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length === 0;

  - description: "Should handle large label lists"
    vars:
      labels: |
        INBOX
        Client A
        Client B
        Client C
        Project 1
        Project 2
        Project 3
        Invoices
        Legal
        Travel
        Marketing
        Sales
        Support
        Development
        SENT
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return Array.isArray(parsed) && parsed.length > 5;
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.every(item =>
            item.label &&
            item.categoryName &&
            item.description &&
            ['HIGH', 'MEDIUM', 'LOW'].includes(item.confidence)
          );

  - description: "Should provide meaningful descriptions"
    vars:
      labels: |
        Quarterly Reports
        Team Meetings
        INBOX
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.every(item =>
            item.description &&
            item.description.length > 10 &&
            item.description.toLowerCase().includes('email')
          );
