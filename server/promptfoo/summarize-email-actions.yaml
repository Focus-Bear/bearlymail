providers:


  - id: google:gemini-3.1-flash-lite
    config:
      temperature: 0
prompts:
  - file://prompts/summarize-email-actions.md

tests:
  - vars:
      isThread: false
      subject: "Action Items"
      contextNote: ""
      body: "Hi team, here are the action items: 1) Review the API documentation by Friday 2) Schedule the user testing session 3) Prepare the budget proposal 4) Update the project timeline"
    assert:
      - type: javascript
        value: |
          let parsed;
          try {
            const raw = typeof output === 'string' ? output : JSON.stringify(output);
            const jsonMatch = raw.match(/\{[\s\S]*\}/);
            parsed = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
          } catch (e) {
            throw new Error(`Expected JSON response, got: ${String(output).substring(0, 200)}`);
          }
          if (typeof parsed.summary !== 'string' || parsed.summary.length < 10) {
            throw new Error(`Expected non-empty summary, got: ${JSON.stringify(parsed.summary)}`);
          }
          const lower = parsed.summary.toLowerCase();
          const hasActions = lower.includes('review') || lower.includes('schedule') || lower.includes('prepare') || lower.includes('update') || lower.includes('action');
          if (!hasActions) {
            throw new Error(`Expected action items in summary. Got: ${parsed.summary.substring(0, 200)}`);
          }
          if (!parsed.sentiment || typeof parsed.sentiment.score !== 'number') {
            throw new Error(`Expected sentiment.score number`);
          }
          const validCategories = ['Newsletters', 'Sales & Marketing', 'Customer Support', 'HR & Admin', 'Finance', 'Partnerships', 'GitHub & Code', 'Personal', 'Other'];
          if (!validCategories.includes(parsed.category)) {
            throw new Error(`category "${parsed.category}" not in valid list`);
          }
          if (typeof parsed.categoryExplanation !== 'string') {
            throw new Error(`Expected categoryExplanation string`);
          }
          return true;
    description: "Should extract action items JSON with sentiment and category"

  - vars:
      isThread: false
      subject: "Next Steps"
      contextNote: ""
      body: "Please complete the following: Send the report, update the dashboard, and confirm with the client."
    assert:
      - type: javascript
        value: |
          let parsed;
          try {
            const raw = typeof output === 'string' ? output : JSON.stringify(output);
            const jsonMatch = raw.match(/\{[\s\S]*\}/);
            parsed = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
          } catch (e) {
            throw new Error(`Expected JSON response, got: ${String(output).substring(0, 200)}`);
          }
          if (typeof parsed.summary !== 'string' || parsed.summary.length < 10) {
            throw new Error(`Expected non-empty summary, got: ${JSON.stringify(parsed.summary)}`);
          }
          const lower = parsed.summary.toLowerCase();
          const hasActions = lower.includes('send') || lower.includes('update') || lower.includes('confirm') || lower.includes('report');
          if (!hasActions) {
            throw new Error(`Expected action items. Got: ${parsed.summary.substring(0, 200)}`);
          }
          if (!parsed.sentiment || typeof parsed.sentiment.score !== 'number') {
            throw new Error(`Expected sentiment.score`);
          }
          const validCategories = ['Newsletters', 'Sales & Marketing', 'Customer Support', 'HR & Admin', 'Finance', 'Partnerships', 'GitHub & Code', 'Personal', 'Other'];
          if (!validCategories.includes(parsed.category)) {
            throw new Error(`category "${parsed.category}" not in valid list`);
          }
          return true;
    description: "Should identify actionable tasks with sentiment and category"
