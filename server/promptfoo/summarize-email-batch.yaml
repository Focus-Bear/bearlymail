description: "Batch email summarization prompts for BearlyMail"

providers:
  - openai:gpt-4.1-mini
  # Uncomment below if you have Gemini API key
  # - google:gemini-pro

prompts:
  - file://prompts/summarize-email-batch.md

defaultTest:
  options:
    provider:
      config:
        temperature: 0.1

tests:
  # Test 1: Basic batch summarization with default TL;DR format
  - vars:
      emails:
        - index: 0
          subject: "Q4 Project Update"
          body: "Hi team, I wanted to update you on our Q4 project progress. We've completed 80% of the milestones, encountered some delays with the API integration, but overall we're on track to meet our deadline."
          isThread: false
          messageCount: 1
        - index: 1
          subject: "Meeting Tomorrow"
          body: "Just a reminder that we have a team meeting tomorrow at 2pm in Conference Room B. Please bring your status updates."
          isThread: false
          messageCount: 1
      customInstructions: null
    assert:
      - type: is-json
        description: "Response should be valid JSON"
      - type: javascript
        value: |
          const parsed = typeof output === 'string' ? JSON.parse(output) : output;
          // Should have summaries for both emails
          if (!parsed['0'] || !parsed['1']) {
            throw new Error('Missing summaries for one or more emails');
          }
          // Each summary should be a non-empty string
          if (typeof parsed['0'] !== 'string' || parsed['0'].length < 10) {
            throw new Error('Summary for email 0 is too short or invalid');
          }
          if (typeof parsed['1'] !== 'string' || parsed['1'].length < 10) {
            throw new Error('Summary for email 1 is too short or invalid');
          }
          return true;
        description: "Should have summaries for all emails"
      - type: llm-rubric
        value: |
          The response should contain concise summaries for both emails.
          Email 0 summary should mention Q4 project, progress or milestones.
          Email 1 summary should mention meeting, tomorrow, or 2pm.
          Summaries should be brief (1-2 sentences each) and capture the key points.
        description: "Summaries should capture key information from each email"

  # Test 2: Batch summarization with thread emails
  - vars:
      emails:
        - index: 0
          subject: "Feature Request Discussion"
          body: |
            [Message 1 from Alice on 12/10/2024]:
            I think we should add a dark mode feature.

            ---

            [Message 2 from Bob on 12/11/2024]:
            Great idea! I can start working on it next sprint.

            ---

            [Message 3 from Alice on 12/12/2024]:
            Perfect, let's discuss the design in our next meeting.
          isThread: true
          messageCount: 3
        - index: 1
          subject: "Bug Report #456"
          body: "Users are reporting that the login button doesn't work on mobile Safari. This is a critical issue affecting iOS users."
          isThread: false
          messageCount: 1
      customInstructions: null
    assert:
      - type: is-json
        description: "Response should be valid JSON"
      - type: llm-rubric
        value: |
          The response should contain summaries for both emails (indices 0 and 1).
          For the thread email (index 0): The summary should capture the discussion about dark mode and mention that it will be worked on next sprint or discussed in a meeting.
          For the bug report (index 1): The summary should mention login button, mobile Safari, or iOS issue.
          Thread summaries should synthesize the entire conversation, not just the first message.
        description: "Should properly summarize both thread and single emails"

  # Test 3: Batch summarization with custom instructions
  - vars:
      emails:
        - index: 0
          subject: "GitHub PR #123 - Add user authentication"
          body: "This PR adds JWT-based authentication to the API. Changes include: new auth middleware, user model updates, and login/logout endpoints. Tests are passing."
          isThread: false
          messageCount: 1
        - index: 1
          subject: "GitHub Issue #456 - Performance regression"
          body: "After the latest release, we've noticed a 30% slowdown in API response times. This appears to be related to the new database queries introduced in PR #400."
          isThread: false
          messageCount: 1
      customInstructions: "Extract only the action items or technical changes. Format as bullet points. Focus on what needs to be done or what was changed."
    assert:
      - type: is-json
        description: "Response should be valid JSON"
      - type: llm-rubric
        value: |
          The response should follow the custom instructions and format summaries as bullet points or list items.
          For email 0: Should mention JWT, authentication, middleware, or API changes.
          For email 1: Should mention performance regression, slowdown, or the related PR.
          The format should be action-oriented as per the custom instructions, not just a narrative TL;DR.
        description: "Should follow custom summarization instructions"

  # Test 4: Large batch with varied email types
  - vars:
      emails:
        - index: 0
          subject: "Invoice #2024-001"
          body: "Please find attached invoice #2024-001 for $5,000. Payment is due within 30 days."
          isThread: false
          messageCount: 1
        - index: 1
          subject: "Weekly Newsletter"
          body: "This week's highlights: New product launch, Company picnic next Friday, Q3 earnings exceeded expectations by 15%."
          isThread: false
          messageCount: 1
        - index: 2
          subject: "Your order has shipped"
          body: "Good news! Your order #12345 has shipped and is expected to arrive by Thursday. Track your package at: track.example.com/12345"
          isThread: false
          messageCount: 1
        - index: 3
          subject: "Urgent: Server Down"
          body: "Production server is experiencing outages. Team is investigating. ETA for resolution: 2 hours."
          isThread: false
          messageCount: 1
      customInstructions: null
    assert:
      - type: is-json
        description: "Response should be valid JSON"
      - type: javascript
        value: |
          const parsed = typeof output === 'string' ? JSON.parse(output) : output;
          // Should have summaries for all 4 emails
          const keys = Object.keys(parsed);
          if (keys.length !== 4) {
            throw new Error(`Expected 4 summaries, got ${keys.length}`);
          }
          for (let i = 0; i < 4; i++) {
            if (!parsed[String(i)] || parsed[String(i)].length < 10) {
              throw new Error(`Missing or too short summary for email ${i}`);
            }
          }
          return true;
        description: "Should handle batch of 4 emails correctly"
      - type: llm-rubric
        value: |
          Each of the 4 emails should have a distinct, relevant summary:
          - Email 0 (invoice): Should mention invoice, $5,000, or payment due
          - Email 1 (newsletter): Should mention product launch, picnic, or Q3 earnings
          - Email 2 (shipping): Should mention order shipped, arriving Thursday, or tracking
          - Email 3 (urgent): Should mention server down, outage, or 2 hour ETA
          Summaries should be concise and not mixed up between emails.
        description: "Should correctly summarize each email in a large batch"

  # Test 5: Edge case - single email in batch
  - vars:
      emails:
        - index: 0
          subject: "Quick Question"
          body: "Hey, do you have time for a quick call this afternoon to discuss the proposal?"
          isThread: false
          messageCount: 1
      customInstructions: null
    assert:
      - type: is-json
        description: "Response should be valid JSON"
      - type: javascript
        value: |
          const parsed = typeof output === 'string' ? JSON.parse(output) : output;
          if (!parsed['0']) {
            throw new Error('Missing summary for the single email');
          }
          return true;
        description: "Should handle single email in batch format"
      - type: llm-rubric
        value: |
          The summary should mention a request for a call, meeting, or discussion about a proposal.
          It should be a concise TL;DR format.
        description: "Single email summary should be accurate"
